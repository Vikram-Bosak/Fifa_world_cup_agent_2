name: FIFA Insider USA — Autonomous Pipeline

on:
  schedule:
    # Runs every 1 hour for maximum content freshness
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUNBUFFERED: '1'

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Python Setup ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Cache pip dependencies (speeds up workflow significantly) ──────
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Install dependencies ───────────────────────────────────────────
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 5. Create output directory ────────────────────────────────────────
      - name: Create output directory
        run: mkdir -p output

      # ── 6. Agent 1 — Downloader ───────────────────────────────────────────
      - name: Run Agent 1 (Downloader)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTER_SOURCE_PROFILE: ${{ secrets.TWITTER_SOURCE_PROFILE }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python agent_1_download.py

      # ── 7. Agent 2 — Editor ───────────────────────────────────────────────
      - name: Run Agent 2 (Editor)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python agent_2_edit.py

      # ── 8. Agent 3 — Uploader ─────────────────────────────────────────────
      - name: Run Agent 3 (Uploader)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python agent_3_upload.py

      # ── 9. Commit updated state & cookies back to repo ────────────────────
      - name: Commit Processed State
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update pipeline state [skip ci]"
          file_pattern: "output/pipeline_state.json cookies.json"
